name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure public browser key
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          python - <<'PY'
          import os,json
          key=os.getenv('MAPTILER_KEY','')
          if not key: raise SystemExit('Missing MAPTILER_KEY')
          with open('config.js','w') as f: f.write('window.MAPTILER_PUBLIC_KEY = '+json.dumps(key)+';\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
